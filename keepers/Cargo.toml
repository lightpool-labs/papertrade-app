[package]
name = "papertrader-keepers"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Paper market keepers (liqd / harvest / push_fees)"
rust-version = "1.96.0"

[[bin]]
name = "paper-keeper"
path = "src/bin/paper_keeper.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

lightpool-sdk = { path = "../../lightpool-sdk-rust" }
