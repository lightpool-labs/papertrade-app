[package]
name = "papertrade-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Standalone papertrade load / soak CLIs (not started by scripts/dev.sh)"
rust-version = "1.96.0"

[workspace]

[[bin]]
name = "hold-opens"
path = "src/bin/hold_opens.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

lightpool-sdk = { path = "../../lightpool-sdk-rust" }
